
<div class="p-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
    <div>
      <nav class="text-xs text-gray-500 mb-2 flex items-center gap-1.5">
        <a routerLink="/dashboard" class="hover:text-[#0055FF] transition-colors">Dashboard</a>
        <span>/</span>
        <a routerLink="/productos" class="hover:text-[#0055FF] transition-colors">Productos</a>
        <span>/</span>
        <span class="text-gray-700 font-medium">{{ isEdit ? 'Editar producto' : 'Nuevo producto' }}</span>
      </nav>
      <h1 class="text-2xl font-extrabold text-[#071938]">{{ isEdit ? 'Editar producto' : 'Nuevo producto' }}</h1>
      <p class="text-sm text-gray-500 mt-0.5">{{ isEdit ? 'Actualiza la información del producto' : 'Completa la información para registrar un producto en el sistema' }}</p>
    </div>
    <button
      routerLink="/productos"
      class="inline-flex items-center gap-2 text-sm font-semibold text-gray-600 hover:text-[#071938] border border-gray-200 hover:border-gray-300 bg-white px-4 py-2.5 rounded-lg transition-colors"
    >
      <span>←</span>
      Volver
    </button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-5">
    <div class="flex items-center gap-2 mb-5 pb-3 border-b border-gray-100">
      <span class="w-7 h-7 rounded-lg bg-[#0055FF] text-white flex items-center justify-center text-xs font-bold">1</span>
      <h3 class="font-bold text-gray-800">Información básica</h3>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div>
        <label for="product-code" class="block text-xs font-semibold text-gray-700 mb-1.5">Código <span class="text-red-500">*</span></label>
        <input
          id="product-code"
          type="text"
          [(ngModel)]="form.code"
          required
          placeholder="Ej: PR-200"
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition-all"
        />
      </div>
      <div class="md:col-span-2 lg:col-span-2">
        <label for="product-name" class="block text-xs font-semibold text-gray-700 mb-1.5">Nombre <span class="text-red-500">*</span></label>
        <input
          id="product-name"
          type="text"
          [(ngModel)]="form.name"
          required
          placeholder="Ej: MANÍ SALADO JUMBO 150 G Bx50"
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition-all"
        />
      </div>
      <div>
        <label for="product-presentation" class="block text-xs font-semibold text-gray-700 mb-1.5">Presentación (cantidad por caja)</label>
        <input
          id="product-presentation"
          type="number"
          [(ngModel)]="form.presentation"
          placeholder="Ej: 24"
          min="0"
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition-all"
        />
      </div>
      <div>
        <label for="product-unit" class="block text-xs font-semibold text-gray-700 mb-1.5">Unidad</label>
        <select
          id="product-unit"
          [(ngModel)]="form.unit"
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition-all bg-white"
        >
          <option value="BULTO">Bulto</option>
          <option value="CAJA">Caja</option>
          <option value="PACA">Paca</option>
        </select>
      </div>
      <div>
        <label for="product-categoryId" class="block text-xs font-semibold text-gray-700 mb-1.5">Categoría <span class="text-red-500">*</span></label>
        <select
          id="product-categoryId"
          [(ngModel)]="form.categoryId"
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition-all bg-white"
        >
          <option [value]="null">Seleccionar categoría</option>
          @for (cat of categories(); track cat.id) {
            <option [value]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>
      <div>
        <label for="product-weight" class="block text-xs font-semibold text-gray-700 mb-1.5">Peso (etiqueta)</label>
        <input
          id="product-weight"
          type="text"
          [(ngModel)]="form.weight"
          placeholder="Ej: 250g"
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition-all"
        />
      </div>
      <div>
        <label for="product-weightGrams" class="block text-xs font-semibold text-gray-700 mb-1.5">Peso en gramos</label>
        <input
          id="product-weightGrams"
          type="number"
          [(ngModel)]="form.weightGrams"
          placeholder="Ej: 250"
          min="0"
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition-all"
        />
      </div>
    </div>
  </div>

    <div class="flex items-end">
      <label class="inline-flex items-center gap-2.5 cursor-pointer select-none p-2.5 rounded-lg hover:bg-gray-50 transition-colors border border-gray-100 w-full">
        <input
          type="checkbox"
          [(ngModel)]="form.active"
          class="w-4 h-4 text-[#0055FF] border-gray-300 rounded focus:ring-blue-500"
        />
        <div>
          <span class="text-xs font-semibold text-gray-700 block">Producto activo</span>
          <span class="text-[11px] text-gray-500">Podrá ser usado en pedidos</span>
        </div>
      </label>
    </div>

  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-end gap-3">
    <button
      type="button"
      (click)="router.navigate(['/productos'])"
      class="px-5 py-2.5 rounded-lg text-sm font-bold text-gray-600 border border-gray-200 bg-white hover:bg-gray-50 hover:border-gray-300 transition-colors"
    >
      Cancelar
    </button>
    <button
      type="button"
      (click)="onSave()"
      [disabled]="!esValido() || isSubmitting"
      class="bg-[#0055FF] hover:bg-[#0044DD] disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-2.5 px-5 rounded-lg text-sm inline-flex items-center gap-2 transition-colors"
    >
      @if (isSubmitting) {
        <span class="animate-spin">⏳</span>
        Guardando...
      } @else {
        <span>💾</span>
        {{ isEdit ? 'Actualizar producto' : 'Guardar producto' }}
      }
    </button>
  </div>
</div>
