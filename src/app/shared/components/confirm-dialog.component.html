<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
  <div class="bg-white rounded-2xl shadow-2xl border border-gray-200/80 w-full max-w-md animate-scale-in overflow-hidden">
    <div class="flex items-start gap-4 p-6 sm:p-7">
      <div class="w-12 h-12 shrink-0 rounded-2xl flex items-center justify-center shadow-xs"
        [class.bg-blue-50]="!isDanger()"
        [class.bg-red-50]="isDanger()">
        @if (isDanger()) {
          <svg class="w-6 h-6 text-red-500 animate-icon-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        } @else {
          <svg class="w-6 h-6 text-[#0055FF] animate-icon-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        }
      </div>
      <div class="min-w-0">
        <h3 class="font-bold text-[#071938] text-base sm:text-lg leading-snug">{{ title() }}</h3>
        @if (message()) {
          <p class="text-xs sm:text-sm text-gray-500 mt-1.5 leading-relaxed">{{ message() }}</p>
        }
      </div>
    </div>
    <div class="flex justify-end gap-3 px-6 pb-6 bg-gray-50/50 pt-3 border-t border-gray-100">
      @if (!singleButton()) {
        <button
          type="button"
          (click)="cancelled.emit()"
          class="py-2.5 px-5 rounded-xl text-xs sm:text-sm font-bold text-gray-700 bg-white border border-gray-300 hover:bg-gray-100 transition-all shadow-xs active:scale-95"
        >
          {{ cancelLabel() }}
        </button>
      }
      <button
        type="button"
        (click)="confirmed.emit()"
        [class]="confirmClasses()"
        class="text-white font-bold py-2.5 px-5 rounded-xl text-xs sm:text-sm transition-all shadow-md active:scale-95 btn-shimmer"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
