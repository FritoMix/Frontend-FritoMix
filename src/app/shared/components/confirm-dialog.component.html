<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl border border-gray-200 w-full max-w-md">
    <div class="flex items-start gap-4 p-6">
      <div class="w-12 h-12 shrink-0 rounded-full flex items-center justify-center"
        [class.bg-blue-50]="!isDanger()"
        [class.bg-red-50]="isDanger()">
        @if (isDanger()) {
          <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        } @else {
          <svg class="w-6 h-6 text-[#0055FF]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        }
      </div>
      <div class="min-w-0">
        <h3 class="font-bold text-[#071938] text-base">{{ title() }}</h3>
        @if (message()) {
          <p class="text-sm text-gray-600 mt-1">{{ message() }}</p>
        }
      </div>
    </div>
    <div class="flex justify-end gap-3 px-6 pb-6">
      @if (!singleButton()) {
        <button
          type="button"
          (click)="cancel.emit()"
          class="py-2.5 px-5 rounded-lg text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors"
        >
          {{ cancelLabel() }}
        </button>
      }
      <button
        type="button"
        (click)="confirm.emit()"
        [class]="confirmClasses()"
        class="text-white font-bold py-2.5 px-5 rounded-lg text-sm transition-colors shadow-sm"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
