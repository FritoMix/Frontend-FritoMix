<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FritoMix S.A.S - Gestión de Ventas y Despachos</title>
  <meta name="description" content="Sistema de gestión de ventas, despachos e inventario para Pasabocas FritoMix S.A.S">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071938">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FritoMix">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="logo-fritomix.png">
  <link rel="apple-touch-icon" href="pwa-icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Splash screen de arranque (se oculta al montar la app) -->
  <div id="fritomix-splash" aria-hidden="true">
    <div class="fritomix-splash-inner">
      <img src="logo-fritomix.png" alt="FritoMix" width="120" height="108">
      <p>FritoMix S.A.S</p>
      <span class="fritomix-splash-loader"></span>
    </div>
    <style>
      #fritomix-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #071938; color: #fff;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .4s ease-out;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      #fritomix-splash.fritomix-splash-hidden { opacity: 0; pointer-events: none; }
      .fritomix-splash-inner { text-align: center; }
      .fritomix-splash-inner img {
        filter: drop-shadow(0 8px 24px rgba(0,0,0,.35));
        margin: 0 auto;
      }
      .fritomix-splash-inner p {
        margin: 18px 0 6px; font-weight: 800; font-size: 20px; letter-spacing: .5px;
      }
      .fritomix-splash-loader {
        display: inline-block; width: 34px; height: 34px; margin-top: 10px;
        border: 3px solid rgba(255,255,255,.2); border-top-color: #fff;
        border-radius: 50%; animation: fritomix-spin .8s linear infinite;
      }
      @keyframes fritomix-spin { to { transform: rotate(360deg); } }
    </style>
  </div>
  <app-root></app-root>
  <script>
    (function () {
      var splash = document.getElementById('fritomix-splash');
      if (!splash) return;
      var hide = function () { splash.classList.add('fritomix-splash-hidden'); };
      setTimeout(function () { if (document.querySelector('app-root') && document.querySelector('app-root').children.length) hide(); }, 1200);
      setTimeout(hide, 6000);
    })();
  </script>
</body>
</html>
